# docker-compose.dev.yml — ms-media-service (desarrollo local con Docker)
# Uso: docker compose -f docker-compose.dev.yml up -d
#
# Lee las variables directamente del .env local.
# Para desarrollo sin Docker usa: npm run start:dev

services:
  ms-media-media-service:
    build: .
    ports:
      - "10406:10406"
      - "20406:20406"
    env_file: .env
    environment:
      NODE_ENV: development
    volumes:
      - ${MEDIA_HOST_PATH:-./dev-media}:/proyectos/NEW_HCE/MEDIA
      - ${CERTS_HOST_PATH:-../certs-dev}:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  default:
    name: hce-dev
    external: true
