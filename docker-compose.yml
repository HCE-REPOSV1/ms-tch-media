# docker-compose.yml — ms-tch-media (producción)
# Uso: docker compose down && docker compose build && docker compose up -d
#
# En el servidor solo necesitas un .env con una línea:
#   VAULT_TOKEN=hvs.xxxx
# El entrypoint.sh carga el resto desde Vault al arrancar.

services:
  ms-tch-media:
    build: .
    ports:
      - "10406:10406"
      - "20406:20406"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "10406"
      VAULT_ADDR: "http://host.docker.internal:8200"
      VAULT_SECRET_PATH: "hce/nestjs/tch-media"
    volumes:
      - ${MEDIA_PATH:-/proyectos/NEW_HCE/MEDIA}:/proyectos/NEW_HCE/MEDIA
      - /proyectos/certs:/proyectos/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10406/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
